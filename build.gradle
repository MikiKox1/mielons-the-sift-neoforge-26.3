plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        // The Fabric source release used split environment source sets. NeoForge
        // ships one universal mod JAR, so compile both trees into that JAR while
        // client-only entry points are migrated to Dist.CLIENT event hooks.
        java.srcDir 'src/client/java'
        resources.srcDir 'src/client/resources'
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'com.geckolib'
            includeGroup 'software.bernie.geckolib'
        }
    }

    // LambDynamicLights API is optional at runtime; 26.2 requires own target ABI.
    maven {
        name = 'Gegy'
        url = uri('https://maven.gegy.dev')
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Standalone Prime 2 stage smoke; never the user's Modrinth profile.
            // A new loader release must never reuse a previous test world's directory.
            gameDirectory = project.file("run/client-${project.neo_version}-sky-alpha2")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Must remain separate from the client and all player saves.
            gameDirectory = project.file("run/server-${project.neo_version}-sky-alpha2")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-26.2:${project.geckolib_version}"
    // GeckoLib's runtime client mixins add GeoRenderState to vanilla render states.
    // Consume its published sidecar so ModDevGradle exposes the same interface at compile time.
    interfaceInjectionData "com.geckolib:geckolib-neoforge-26.2:${project.geckolib_version}"
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}+${project.minecraft_version}"
}

// Prime 2 invariant: build/test on the latest published NeoForge for this
// Minecraft line, while keeping the independent, OPEN-ENDED mod dependency
// range [neo_min_version,) (provisionally >=26.2.0.90).
// Keep the compile/test loader pinned for reproducibility and refuse tests
// if that pin becomes stale. Do not conflate this pin with minimum support.
// If the metadata endpoint is unreachable, fail closed rather than claim the
// tested loader is current. This task does not install any application.
def pinnedNeoForge = project.neo_version.toString()
def pinnedNeoMinimum = project.neo_min_version.toString()
def targetMcVersion = project.minecraft_version.toString()
tasks.register('verifyLatestNeoForge') {
    group = 'verification'
    description = 'Confirm the pinned MC 26.2 NeoForge version is still the latest official Maven release.'
    inputs.property('neo_version', pinnedNeoForge)
    inputs.property('neo_min_version', pinnedNeoMinimum)
    inputs.property('minecraft_version', targetMcVersion)
    doLast {
        def metadataUrl = 'https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml'
        def connection = new URI(metadataUrl).toURL().openConnection()
        connection.setUseCaches(false)
        connection.setConnectTimeout(15000)
        connection.setReadTimeout(15000)
        connection.setRequestProperty('Cache-Control', 'no-cache')
        def metadata = connection.inputStream.withCloseable { it.getText('UTF-8') }
        def matcher = metadata =~ /<version>(26\.2\.0\.(\d+)(?:-[^<]+)?)<\/version>/
        def candidates = []
        matcher.each { match ->
            candidates << [version: match[1], build: Integer.parseInt(match[2])]
        }
        if (candidates.isEmpty()) {
            throw new GradleException('Cannot verify latest NeoForge 26.2 in official Maven metadata; test blocked.')
        }
        def latest = candidates.max { a, b ->
            (a.build <=> b.build) ?: ((a.version.contains('-') ? 0 : 1) <=> (b.version.contains('-') ? 0 : 1))
        }.version
        if (pinnedNeoForge != latest) {
            throw new GradleException(
                "NeoForge BUILD/TEST pin is outdated. Latest official MC 26.2: ${latest}; " +
                "neo_version=${pinnedNeoForge}. Update only neo_version for testing. " +
                'Keep independent neo_min_version and the open-ended [minimum,) dependency.'
            )
        }
        if (!pinnedNeoMinimum.startsWith('26.2.0.')) {
            throw new GradleException(
                "The Sift 26.2 provisional minimum must belong to the target MC series, found ${pinnedNeoMinimum}"
            )
        }
        logger.lifecycle("Verified latest NeoForge for MC ${targetMcVersion} build/tests: ${latest}; " +
            "packaged minimum: ${pinnedNeoMinimum}, no upper bound")
    }
}

tasks.matching {
    it.name in ['build', 'check', 'test', 'compileJava', 'compileTestJava', 'runData', 'runServer', 'runClient'] ||
        it.name.startsWith('runGameTest')
}.configureEach {
    dependsOn tasks.named('verifyLatestNeoForge')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_min_version         : neo_min_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_author              : mod_author,
            mod_description         : mod_description,
            geckolib_version        : geckolib_version,
            lambdynlights_version   : lambdynlights_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
