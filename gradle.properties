org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# Compile/test with the latest verified NeoForge for MC 26.1.2.
# The MOD'S MINIMUM COMPATIBLE loader version is independent of the
# build/test version and must NOT be raised just because a newer loader is used.
# Keep an OPEN upper bound in META-INF/neoforge.mods.toml: [neo_min_version,).
neo_version=26.1.2.117
# Earliest independently validated loader: 26.1.2.100.
# Full user gameplay A01-A20 was accepted on .117; .100 passed real clean
# compile, isolated dedicated Sift/portal/save and shaderless/Iris client boot.
# Keep the NeoForge upper compatibility range OPEN.
neo_min_version=26.1.2.100

# Dependencies
geckolib_version=5.5.2
lambdynlights_version=4.11.2

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=1.1.2-neoforge.1
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Unofficial NeoForge Minecraft 26.1.2 port of Mielon's The Sift 1.1.2. Includes the original gameplay, world generation and compatible sky rendering for Photon and Complementary Shaders.
