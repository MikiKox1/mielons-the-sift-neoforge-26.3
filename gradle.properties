org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
# Compile/test with the latest verified NeoForge for MC 26.3.
# The MOD'S MINIMUM COMPATIBLE loader version is independent of the
# build/test version and must NOT be raised just because a newer loader is used.
# Keep an OPEN upper bound in META-INF/neoforge.mods.toml: [neo_min_version,).
neo_version=26.3.0.76
neo_min_version=26.3.0.64-beta

# Dependencies
geckolib_version=5.5.7
lambdynlights_version=4.13.0

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=1.1.2-neoforge.2
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Community NeoForge 26.3 port of Mielon's The Sift 1.1.2. Includes dimension of siftslate, Ichor, resonant souls, and Photon/Complementary shader compatibility.
