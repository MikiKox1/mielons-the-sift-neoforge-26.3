org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# Compile/test with the latest verified NeoForge for MC 26.1.2.
# The MOD'S MINIMUM COMPATIBLE loader version is independent of the
# build/test version and must NOT be raised just because a newer loader is used.
# Keep an OPEN upper bound in META-INF/neoforge.mods.toml: [neo_min_version,).
neo_version=26.1.2.117
# Provisional minimum for MC26.1.2. Lower only after independent tests.
neo_min_version=26.1.2.117

# Dependencies
geckolib_version=5.5.2
lambdynlights_version=4.11.2

# Mod
mod_id=the_sift
mod_name=Mielon's The Sift
mod_license=MIT
mod_version=1.1.2-neoforge.1-alpha.1
mod_group_id=mielon.thesift
mod_author=Mielon (original); MikiKox1 (NeoForge community port)
mod_description=Independent experimental backport of Mielon's The Sift 1.1.2 to NeoForge Minecraft 26.1.2. Gameplay and shader verification pending.
