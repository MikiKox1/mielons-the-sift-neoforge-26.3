modLoader="javafml"
loaderVersion="[12,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="ImpSteve — Dark Sniffer texture; Fuzja Jądrowa — Rift music disc; StrawberrySushi_ — Korean localization; Echo_Dev — Wellspring remix"
displayURL="https://x.com/MielonDev"
iconFile="assets/the_sift/icon.png"
description='''${mod_description}'''

[[mixins]]
config="the_sift.mixins.json"

[[mixins]]
config="the_sift.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lambdynlights"
type="optional"
versionRange="[${lambdynlights_version},)"
ordering="AFTER"
side="CLIENT"

[modproperties.${mod_id}."yumi:entrypoints"]
"lambdynlights:initializer"="mielon.thesift.client.light.TheSiftDynamicLightsInitializer"
