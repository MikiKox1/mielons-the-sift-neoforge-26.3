modLoader="javafml"
# NeoForge MC26.1.2.100+ provides FML Java language provider 11.0.
# This is NOT the NeoForge compatibility version range below.
loaderVersion="[11,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="Development NeoForge 26.1.2 backport: MikiKox1, assisted by AI; original author Mielon; ImpSteve — Dark Sniffer texture; Fuzja Jądrowa — Rift music disc; StrawberrySushi_ — Korean localization; Echo_Dev — Wellspring remix"
displayURL="https://github.com/MikiKox1/mielons-the-sift-neoforge-26.3"
# Icon path is packaged locally; FML 11.0.15 with NeoForge 26.1.2.100
# accepts iconFile. This does not change the dependency version range.
iconFile="assets/the_sift/icon.png"
description='''${mod_description}'''

[[mixins]]
config="the_sift.mixins.json"

[[mixins]]
config="the_sift.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},6)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lambdynlights"
type="optional"
versionRange="[${lambdynlights_version},)"
ordering="AFTER"
side="CLIENT"

[[modproperties.${mod_id}."yumi:entrypoints"."lambdynlights:initializer"]]
value="mielon.thesift.client.light.TheSiftDynamicLightsInitializer"
